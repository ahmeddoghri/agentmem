name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  adversarial:
    # The salience gate can regress silently: it keeps writing memories, they
    # are just filler. This fails the build if the leak rate climbs above
    # zero or if gate precision drops on either labeled corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e .
      - name: Run the gate + leak-rate benchmark
        run: |
          python -m agentmem.eval_v2
          python - <<'EOF'
          from agentmem.eval_v2 import build_report

          report = build_report()
          for split in ("adversarial", "holdout"):
              v2 = report["gate"][split]["v2"]
              assert v2["precision"] == 1.0, (split, v2)
              assert v2["recall"] == 1.0, (split, v2)

          e2e = report["end_to_end"]["v2"]
          assert e2e["leak_rate"] == 0.0, e2e
          print("gate precision and zero leak rate hold")
          EOF

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run example
        run: python examples/quickstart.py
      - name: Run benchmark
        run: python -m agentmem.eval
